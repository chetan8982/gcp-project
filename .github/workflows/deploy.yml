name: Deploy to Cloud Run QA

on:
  push:
    branches:
      - qa

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/315009712922/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: my-first-qa@qa01-500309.iam.gserviceaccount.com

      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/qa01-500309/app-repo/demo-app-qa:${{ github.sha }} \
            ./app

      - name: Push Image
        run: |
          docker push \
            us-central1-docker.pkg.dev/qa01-500309/app-repo/demo-app-qa:${{ github.sha }}

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy demo-app-qa \
            --image us-central1-docker.pkg.dev/qa01-500309/app-repo/demo-app-qa:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated
