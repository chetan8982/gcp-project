name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - dev
      - qa
      - prod

permissions:
  contents: read
  id-token: write
env:
  REGION: us-central1
  SERVICE_NAME: demo-app-dev
  IMAGE_URI: us-central1-docker.pkg.dev/dev1-500309/app-repo/demo-app-dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set Variables
        run: |
          echo "BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "IMAGE_NAME=demo-app-${{ github.ref_name }}" >> $GITHUB_ENV
          echo "SERVICE_NAME=demo-app-${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Build Image
        run: docker build -t $IMAGE_URI:${{ github.sha }} ./app

      - name: Check Local Images
        run: docker images

      - name: Push Image
        run: docker push $IMAGE_URI:${{ github.sha }}

      - name: Deploy Cloud Run
        run: |
         gcloud run deploy $SERVICE_NAME \
         --image $IMAGE_URI:${{ github.sha }} \
         --region $REGION \
         --platform managed \
         --allow-unauthenticated
